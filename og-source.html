<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;display:flex;font-family:Helvetica,Arial,sans-serif;background:#F6F4EE;color:#2E3A44;overflow:hidden}
.left{width:380px;background:#4C5F6B;position:relative;flex:none}
.left span{position:absolute;top:50%;left:44px;transform:translateY(-50%) rotate(180deg);writing-mode:vertical-rl;
  font-size:17px;letter-spacing:.18em;color:rgba(246,244,238,.9)}
.right{flex:1;padding:78px 72px;display:flex;flex-direction:column;justify-content:center}
h1{font-size:126px;font-weight:700;line-height:.9;letter-spacing:-.02em}
h1 .dot{color:#5A6E7A}
p{margin-top:34px;font-size:26px;line-height:1.5;color:#4C5F6B;max-width:22ch}
.sign{margin-top:38px;font-size:24px;font-weight:500;color:#2E3A44}
</style></head><body>
<div class="left"><span>FAREWELL NOTE</span></div>
<div class="right">
  <h1>THANK<br>YOU<span class="dot">.</span></h1>
  <p>A short thank-you note, and a few personal messages along the way.</p>
  <div class="sign">— Manish Sehgal</div>
</div></body></html>
